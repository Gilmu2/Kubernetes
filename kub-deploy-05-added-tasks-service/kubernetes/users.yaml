apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-pvc
spec:
  accessModes:    
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-097de7e9f2c267044 
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: users
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users-api
          image: mualem/kub-aws-users:latest
          env:
            - name: MONGODB_CONNECTION_URI
              value: 'mongodb+srv://gilmu-db:QD24YsvvTKsXuXk4@users-mongo.rlyb9hi.mongodb.net/?appName=users-mongo'
            - name: AUTH_API_ADDRESS
              value: 'auth-service.default.svc.cluster.local:3000'
          volumeMounts:
          - name: efs-vol
            mountPath: /app/users
      volumes:
      - name: efs-vol
        persistentVolumeClaim:
          claimName: efs-pvc

