apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-app-deployment
  labels:
    group: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-app
    # matchExpressions:
    #  - {key: app, oereator: In, values: [second-app, first-app]}
  template:
    metadata:
      labels:
        app: second-app
    spec:
      containers:
        - name: second-node
          image: mualem/kub-first-app:2
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            initialDelaySeconds: 5
